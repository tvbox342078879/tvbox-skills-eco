<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src about:; img-src https: http: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>微信文章提取（保留排版） · 预览</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#17362c;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:0 auto;padding:32px 24px}header{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{display:grid;place-items:center;width:38px;height:38px;background:#16845d;border-radius:12px;color:#fff;font-weight:800;font-size:20px}.brand{font-weight:700;font-size:16px}.badge{margin-left:auto;font-size:12px;color:#52806c;background:#e4efe8;padding:6px 12px;border-radius:20px}.intro{margin-bottom:24px}h1{font-size:28px;line-height:1.4;margin:0 0 10px;overflow-wrap:anywhere}.sub{font-size:14px;color:#6a7e75;line-height:1.8}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px}.paper{border:1px solid #dfe7e2;border-radius:16px;overflow:hidden;background:white;box-shadow:0 8px 32px #1c503008}.paperhead{padding:15px 20px;font-size:13px;border-bottom:1px solid #edf0ed;color:#6a7e75;display:flex;justify-content:space-between}iframe{display:block;border:0;width:100%;height:780px;background:white}.tools{align-self:start;background:#fff;border:1px solid #dfe7e2;border-radius:16px;padding:22px;position:sticky;top:24px}h2{font-size:16px;margin:0 0 18px}button{font:inherit;cursor:pointer;border-radius:10px;padding:12px 14px;width:100%;border:1px solid #d7e3dc;background:#fff;color:#244b3d;margin-top:10px;font-size:14px}button:hover{background:#f0f7f2}button.primary{background:#16845d;border-color:#16845d;color:#fff;font-weight:600}button.primary:hover{background:#116f4e}button:disabled{opacity:.6;cursor:wait}label{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.6;margin-bottom:8px}input{accent-color:#16845d;margin-top:4px}.hint{color:#74867e;font-size:12px;line-height:1.8}#status{font-size:13px;line-height:1.7;min-height:44px;color:#16845d;margin-top:14px}#status.error{color:#b14232}details{border-top:1px solid #edf0ed;margin-top:14px;padding-top:14px;font-size:12px;color:#74867e;line-height:1.8}summary{cursor:pointer;color:#425e51}ul{padding-left:18px}footer{color:#829188;font-size:12px;line-height:1.8;margin-top:20px}a{color:#16845d}button:focus-visible,a:focus-visible{outline:3px solid #8bc6ad;outline-offset:3px}@media(max-width:760px){.wrap{padding:20px 14px}.layout{display:flex;flex-direction:column}.tools{order:-1;position:static}.badge{display:none}h1{font-size:23px}iframe{height:650px}}
</style>
</head>
<body><div class="wrap">
<header><div class="logo" aria-hidden="true">文</div><div class="brand">微信文章提取（保留排版）</div><span class="badge">文章预览</span></header>
<div class="intro"><h1 id="title"></h1><div class="sub" id="meta"></div></div>
<div class="layout"><section class="paper"><div class="paperhead"><span>排版预览</span><span id="count"></span></div><iframe id="article" title="提取后的文章" sandbox="" referrerpolicy="no-referrer"></iframe></section>
<aside class="tools"><h2>带着排版，一起复制</h2><label><input id="include-meta" type="checkbox" checked>包含标题、作者和来源</label><button id="copy" class="primary">一键复制带格式内容</button><div id="status" role="status" aria-live="polite">复制后，粘贴到目标编辑器。</div><p class="hint">支持 Alt+C 快捷复制。不同编辑器可能调整字体、间距或图片，请在粘贴后检查。</p><details><summary>提取说明</summary><ul id="warnings"></ul></details></aside></div>
<footer>图片保留原站链接，离线时可能无法显示。提取结果仅保存在本次导出的文件中。</footer>
</div>
<script id="article-data" type="application/json">__ARTICLE_DATA__</script>
<script>__CLIPBOARD_SCRIPT__</script>
<script>
const data = JSON.parse(document.getElementById('article-data').textContent);
const $ = id => document.getElementById(id);
document.title = data.title + ' · 微信文章提取（保留排版）';
$('title').textContent = data.title;
$('meta').textContent = data.meta || '已提取正文与常见排版';
$('count').textContent = data.imageCount + ' 张图片';
for (const warning of data.warnings.length ? data.warnings : ['已保留正文及常见排版；交互效果不包含在复制结果中。']) { const li = document.createElement('li'); li.textContent = warning; $('warnings').append(li); }
function selected() { return $('include-meta').checked ? { html: data.fragmentHtml, text: data.text } : { html: data.bodyHtml, text: data.bodyText }; }
function documentHTML() { return $('include-meta').checked ? data.html : data.html.replace(data.fragmentHtml, () => data.bodyHtml); }
function render() { $('article').srcdoc = documentHTML(); }
render(); $('include-meta').addEventListener('change', render);
async function copy() {
  if ($('copy').disabled) return;
  $('copy').disabled = true; $('status').className = '';
  try { const value = selected(); const result = await WechatStyledClipboard.copy(value.html, value.text); $('status').textContent = result === 'rich' ? '已复制正文与排版，可以粘贴了。' : '仅复制了纯文本，格式未复制。请换用支持富文本复制的本机浏览器重试。'; }
  catch (error) { $('status').className = 'error'; $('status').textContent = error.message; }
  finally { $('copy').disabled = false; }
}
$('copy').addEventListener('click', copy);
document.addEventListener('keydown', event => { if (event.altKey && event.key.toLowerCase() === 'c') { event.preventDefault(); copy(); } });
</script></body></html>
